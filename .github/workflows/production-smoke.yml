name: GridFlow production smoke

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gridflow-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Verify web, API proxy, recovery surface and authentication
        env:
          GRIDFLOW_WEB_URL: https://web-production-24fce.up.railway.app
          GRIDFLOW_EXPECT_READY: ${{ vars.GRIDFLOW_EXPECT_READY || 'false' }}
        run: node scripts/production-monitor.mjs

      - name: Record signed monitoring heartbeat
        if: success()
        env:
          GRIDFLOW_WEB_URL: https://web-production-24fce.up.railway.app
          OPERATIONS_PROBE_TOKEN: ${{ secrets.OPERATIONS_PROBE_TOKEN }}
          PROOF_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROOF_RUN_ID: monitor-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile("reports/production-monitor.json", "utf8"));
          if (!/^[a-f0-9]{7,64}$/i.test(report.deployedCommit ?? "")) throw new Error("Production liveness did not expose a valid deployed commit.");
          const response = await fetch(`${process.env.GRIDFLOW_WEB_URL}/backend/operations/proofs`, {
            method: "POST",
            headers: { "content-type": "application/json", authorization: `Bearer ${process.env.OPERATIONS_PROBE_TOKEN}` },
            body: JSON.stringify({ kind: "MONITOR_HEARTBEAT", runId: process.env.PROOF_RUN_ID, sourceUrl: process.env.PROOF_SOURCE_URL, observedAt: new Date().toISOString(), commitSha: report.deployedCommit }),
          });
          if (response.status !== 202) throw new Error(`Operations proof endpoint returned HTTP ${response.status}.`);
          NODE

      - name: Upload monitor evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gridflow-production-monitor-${{ github.run_id }}
          path: reports/production-monitor.json
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update production incident
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "[GridFlow monitor] Production unavailable";
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: "all", per_page: 100 });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const body = `The scheduled production monitor failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nDetected: ${new Date().toISOString()}\n\nNo credentials or response bodies are included.`;
            if (!existing) await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            else {
              if (existing.state === "closed") await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: "open" });
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            }

      - name: Close recovered production incident
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "[GridFlow monitor] Production unavailable";
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100 });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Production recovered. Verified by ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: "closed", state_reason: "completed" });
            }
