name: GridFlow production smoke

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridflow-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify web, API proxy, and authentication
        shell: bash
        env:
          GRIDFLOW_WEB_URL: https://web-production-24fce.up.railway.app
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$GRIDFLOW_WEB_URL/login" >/dev/null

          health="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$GRIDFLOW_WEB_URL/backend/health/live")"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (payload.status !== "ok" || payload.service !== "gridflow-api") process.exit(1);
          ' "$health"

          auth_status="$(curl --silent --show-error --output /tmp/gridflow-auth.json \
            --write-out "%{http_code}" \
            --header "content-type: application/json" \
            --data "{\"email\":\"production-monitor@example.invalid\",\"password\":\"intentionally-invalid\"}" \
            "$GRIDFLOW_WEB_URL/backend/auth/login")"
          test "$auth_status" = "401"

          echo "GridFlow production web, API proxy, and authentication are healthy."
