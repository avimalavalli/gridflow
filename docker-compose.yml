services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridflow
      POSTGRES_PASSWORD: gridflow
      POSTGRES_DB: gridflow
    ports:
      - "5432:5432"
    volumes:
      - gridflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridflow -d gridflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - gridflow_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gridflow_postgres:
  gridflow_redis:
